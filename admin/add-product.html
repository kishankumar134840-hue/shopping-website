<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Product | ZIVORA</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
        }

        /* SIDEBAR */

        .sidebar {
            position: fixed;
            width: 250px;
            height: 100vh;
            background: #c2185b;
            color: white;
            padding: 30px 20px;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 40px;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 13px;
            margin: 10px 0;
            border-radius: 8px;
            font-size: 17px;
        }

        .sidebar a:hover {
            background: rgba(255,255,255,0.2);
        }

        /* MAIN */

        .main {
            margin-left: 250px;
            padding: 40px;
        }

        .main h1 {
            color: #c2185b;
            margin-bottom: 30px;
        }

        /* FORM */

        .form-box {
            background: white;
            max-width: 850px;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #444;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #c2185b;
        }

        textarea {
            height: 120px;
            resize: none;
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        .add-btn {
            background: #c2185b;
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .cancel-btn {
            background: #eee;
            color: #555;
            text-decoration: none;
            padding: 13px 25px;
            border-radius: 8px;
        }

        .add-btn:hover {
            background: #9c1248;
        }

        @media(max-width: 800px) {

            .sidebar {
                width: 200px;
            }

            .main {
                margin-left: 200px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

    <!-- SIDEBAR -->

    <div class="sidebar">

        <h2>ZIVORA Admin</h2>

        <a href="dashboard.html">📊 Dashboard</a>

        <a href="products.html">📦 Products</a>

        <a href="add-product.html">➕ Add Product</a>

        <a href="orders.html">🛒 Orders</a>

        <a href="customers.html">👥 Customers</a>

        <a href="reports.html">📈 Reports</a>

    </div>


    <!-- MAIN -->

    <div class="main">

        <h1>➕ Add New Product</h1>

        <div class="form-box">

            <form>

                <div class="form-row">

                    <div class="form-group">

                        <label>Product Name</label>

                        <input
                            type="text"
                            placeholder="Enter product name"
                            required>

                    </div>


                    <div class="form-group">

                        <label>Category</label>

                        <select required>

                            <option value="">Select Category</option>

                            <option>Fashion</option>

                            <option>Shoes</option>

                            <option>Beauty</option>

                            <option>Accessories</option>

                        </select>

                    </div>

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label>Price</label>

                        <input
                            type="number"
                            placeholder="Enter price"
                            required>

                    </div>


                    <div class="form-group">

                        <label>Stock</label>

                        <input
                            type="number"
                            placeholder="Enter stock quantity"
                            required>

                    </div>

                </div>


                <div class="form-group">

                    <label>Product Image URL</label>

                    <input
                        type="text"
                        placeholder="Paste image URL">

                </div>


                <div class="form-group">

                    <label>Product Description</label>

                    <textarea
                        placeholder="Enter product description"></textarea>

                </div>


                <div class="buttons">

                    <button type="submit" class="add-btn">
                        Add Product
                    </button>

                    <a href="products.html" class="cancel-btn">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
